plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'org.jetbrains.kotlin.plugin.compose' version "${kotlin_version}"
}

version = project.mod_version
group = 'org.polyfrost'
base { archivesName = 'autotext' }

repositories {
    mavenCentral()
    maven { url = 'https://repo.polyfrost.org/releases' }
    maven { url = 'https://repo.polyfrost.org/snapshots' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.pkg.jetbrains.space/public/p/compose/dev' }
    google()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"
    modImplementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    modImplementation "org.polyfrost.oneconfig:${minecraft_version}-fabric:${oneconfig_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
kotlin { jvmToolchain(21) }

tasks.withType(JavaCompile).configureEach { options.release = 21 }
jar {
    from('LICENSE') { rename { 'LICENSE_autotext' } }
}
